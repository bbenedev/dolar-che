[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dolar-bot"
version = "0.1.0"
description = "Discord bot with the Argentine dollar rates, a converter and price alerts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bbenedev" }]
dependencies = ["discord.py>=2.3"]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.0"]

[project.scripts]
dolar-bot = "dolar_bot.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
